<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        
        <div class="row my-3">
            <div class="col-12 col-md-4">
                <div class="bg-primary text-white text-center fw-bold p-3">
                    1
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="bg-success text-white text-center fw-bold p-3">
                    2
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="bg-danger text-white text-center fw-bold p-3">
                    3
                </div>
            </div>
        </div>

        <div class="row my-3">
            <div class="col-12 col-md-6">
                <div class="bg-warning text-dark text-center fw-bold p-3">
                    4
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="bg-info text-dark text-center fw-bold p-3">
                    5
                </div>
            </div>
        </div>

        <div class="row my-3">
            <div class="col-12 col-md-3">
                <div class="bg-secondary text-white text-center fw-bold p-3">
                    6
                </div>
            </div>

            <div class="col-12 col-md-3">
                <div class="bg-dark text-white text-center fw-bold p-3">
                    7
                </div>
            </div>

            <div class="col-12 col-md-3">
                <div class="bg-primary text-white text-center fw-bold p-3">
                    8
                </div>
            </div>

            <div class="col-12 col-md-3">
                <div class="bg-success text-white text-center fw-bold p-3">
                    9
                </div>
            </div>
        </div>


    </div>
    
</body>
</html>
